# CEN429 ders sitesi: main dalına her push'ta siteyi derleyip GitHub Pages'e (gh-pages dalı) yayınlar.
# Paket sürümleri requirements.txt'te sabittir; yerelde denenen sürümlerle aynıdır.
# Ders çıktıları (PDF, PPTX, DOCX, sunum HTML) depoda hazır durur; burada yalnız MkDocs sitesi derlenir.
name: ci
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # git-revision-date ve git-authors eklentileri tam geçmiş ister
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: gh-pages commit'leri ders sorumlusunun adıyla
        run: |
          git config user.name "Ugur Coruh"
          git config user.email "ugur.coruh.tr@gmail.com"
      - run: mkdocs gh-deploy --force
