<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Güvenli başlatma: ortamı, tanıtıcıları, yetkiyi temizle</title>
<style>/* dsanim oynatıcı biçemi — açık/koyu tema; SVG renkleri Python'daki RENK tablosuyla aynı anlamda */
:root {
  --dsa-zemin: #ffffff; --dsa-yuzey: #f8f9fa; --dsa-cizgi: #dee2e6; --dsa-yazi: #1f2933; --dsa-soluk: #6c757d;
  --dsa-vurgu: #fff3bf; --dsa-vurgu-c: #f08c00; --dsa-ana: #1971c2; --dsa-kod: #f8f9fa; --dsa-kod-yazi: #24292f;
}
@media (prefers-color-scheme: dark) {
  :root:not(.dsa-acik) {
    --dsa-zemin: #1e2129; --dsa-yuzey: #262a33; --dsa-cizgi: #3a3f4b; --dsa-yazi: #e9ecef; --dsa-soluk: #adb5bd;
    --dsa-vurgu: #5c4813; --dsa-vurgu-c: #fcc419; --dsa-ana: #4dabf7; --dsa-kod: #161b22; --dsa-kod-yazi: #e6edf3;
  }
}
:root.dsa-koyu {
  --dsa-zemin: #1e2129; --dsa-yuzey: #262a33; --dsa-cizgi: #3a3f4b; --dsa-yazi: #e9ecef; --dsa-soluk: #adb5bd;
  --dsa-vurgu: #5c4813; --dsa-vurgu-c: #fcc419; --dsa-ana: #4dabf7; --dsa-kod: #161b22; --dsa-kod-yazi: #e6edf3;
}
html, body { margin: 0; background: var(--dsa-zemin); color: var(--dsa-yazi);
  font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
.dsa { box-sizing: border-box; padding: 10px 12px 12px; outline: none; max-width: 1200px; margin: 0 auto; }
.dsa *, .dsa *::before, .dsa *::after { box-sizing: border-box; }
.dsa-ust { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 6px; }
.dsa-baslik { font-weight: 700; font-size: 1.05rem; }
.dsa-sayac { color: var(--dsa-soluk); font-size: .85rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
.dsa-govde { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 10px; }
.dsa-govde.dsa-kodsuz { grid-template-columns: 1fr; }
@media (max-width: 760px) { .dsa-govde { grid-template-columns: 1fr; } }
.dsa-sahne { background: var(--dsa-yuzey); border: 1px solid var(--dsa-cizgi); border-radius: 10px; overflow: hidden;
  display: flex; align-items: center; }
.dsa-sahne { justify-content: center; }
.dsa-sahne svg { width: 100%; height: auto; max-height: 440px; display: block; }
.dsa-kod { display: flex; flex-direction: column; min-height: 0; border: 1px solid var(--dsa-cizgi); border-radius: 10px;
  overflow: hidden; background: var(--dsa-kod); }
.dsa-sekme { display: flex; gap: 2px; padding: 4px 6px 0; border-bottom: 1px solid var(--dsa-cizgi); }
.dsa-sekme button { border: 0; background: none; color: var(--dsa-soluk); padding: 4px 10px; font-size: .8rem;
  cursor: pointer; border-bottom: 2px solid transparent; }
.dsa-sekme button.etkin { color: var(--dsa-ana); border-bottom-color: var(--dsa-ana); font-weight: 600; }
.dsa-pre { margin: 0; padding: 8px 0; overflow: auto; max-height: 340px; flex: 1; color: var(--dsa-kod-yazi);
  font: 13px/1.5 'Cascadia Code', Consolas, 'DejaVu Sans Mono', monospace;
  font-variant-ligatures: none; font-feature-settings: 'calt' 0, 'liga' 0; }
.dsa-sat { display: block; padding: 0 10px 0 0; white-space: pre; transition: background .3s; border-left: 3px solid transparent; }
.dsa-sat.vurgu { background: var(--dsa-vurgu); border-left-color: var(--dsa-vurgu-c); }
.dsa-no { display: inline-block; width: 2.6em; padding-right: .8em; text-align: right; color: var(--dsa-soluk); user-select: none; }
.dsa-cap { margin-top: 10px; min-height: 3.2em; padding: 10px 14px; border-radius: 10px; background: var(--dsa-yuzey);
  border: 1px solid var(--dsa-cizgi); font-size: 1.02rem; line-height: 1.5; }
.dsa-cap code { font-family: 'Cascadia Code', Consolas, monospace; font-size: .92em; font-variant-ligatures: none; font-feature-settings: 'calt' 0; background: var(--dsa-kod);
  padding: 1px 5px; border-radius: 4px; border: 1px solid var(--dsa-cizgi); }
.dsa-denetim { display: flex; align-items: center; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.dsa-d { min-width: 38px; height: 34px; border-radius: 8px; border: 1px solid var(--dsa-cizgi); background: var(--dsa-yuzey);
  color: var(--dsa-yazi); cursor: pointer; font-size: 15px; }
.dsa-d:hover { border-color: var(--dsa-ana); }
.dsa-d.dsa-ana { background: var(--dsa-ana); color: #fff; border-color: var(--dsa-ana); min-width: 50px; }
.dsa-d.etkin { border-color: var(--dsa-ana); color: var(--dsa-ana); }
.dsa-cubuk { flex: 1; min-width: 120px; accent-color: var(--dsa-ana); }
.dsa-hiz { height: 34px; border-radius: 8px; border: 1px solid var(--dsa-cizgi); background: var(--dsa-yuzey); color: var(--dsa-yazi); }
.dsa-statik .dsa-denetim { display: none; }
/* iki dilli sahne yazıları: yalnız sayfa dilindeki görünür */
.dsa-dil-tr .l-en, .dsa-dil-en .l-tr { display: none; }
/* sahne öğeleri: renk geçişleri ve belirme/solma */
.dsa svg .e, .dsa svg .ok { transition: opacity .4s ease; }
.dsa svg rect, .dsa svg circle, .dsa svg line, .dsa svg path, .dsa svg text { transition: fill .35s ease, stroke .35s ease; }
.dsa svg .dsa-giris { opacity: 0; }
.dsa svg .dsa-cikis { opacity: 0; }
/* koyu tema: SVG'deki açık renkleri sınıflarla geçersiz kıl */
:root.dsa-koyu .dsa-sahne svg > rect:first-of-type { fill: transparent; }
@media (prefers-color-scheme: dark) { :root:not(.dsa-acik) .dsa-sahne svg > rect:first-of-type { fill: transparent; } }
:root.dsa-koyu .dsa svg .shp.st-normal rect, :root.dsa-koyu .dsa svg .shp.st-normal circle { fill: #2b303b; stroke: #ced4da; }
:root.dsa-koyu .dsa svg .shp.st-normal text, :root.dsa-koyu .dsa svg .lbl.st-normal text { fill: #e9ecef; }
:root.dsa-koyu .dsa svg .shp.st-normal line { stroke: #ced4da; }
:root.dsa-koyu .dsa svg .shp.st-normal circle[r="3.5"] { fill: #ced4da; }
:root.dsa-koyu .dsa svg .shp.st-bos rect { fill: #23272f; }
:root.dsa-koyu .dsa svg .ok.st-normal { stroke: #adb5bd; }
:root.dsa-koyu .dsa svg .frm rect { fill: #262a33; }
:root.dsa-koyu .dsa svg .frm text { fill: #ced4da; }
@media (prefers-color-scheme: dark) {
  :root:not(.dsa-acik) .dsa svg .shp.st-normal rect, :root:not(.dsa-acik) .dsa svg .shp.st-normal circle { fill: #2b303b; stroke: #ced4da; }
  :root:not(.dsa-acik) .dsa svg .shp.st-normal text, :root:not(.dsa-acik) .dsa svg .lbl.st-normal text { fill: #e9ecef; }
  :root:not(.dsa-acik) .dsa svg .shp.st-normal line { stroke: #ced4da; }
  :root:not(.dsa-acik) .dsa svg .shp.st-normal circle[r="3.5"] { fill: #ced4da; }
  :root:not(.dsa-acik) .dsa svg .shp.st-bos rect { fill: #23272f; }
  :root:not(.dsa-acik) .dsa svg .ok.st-normal { stroke: #adb5bd; }
  :root:not(.dsa-acik) .dsa svg .frm rect { fill: #262a33; }
  :root:not(.dsa-acik) .dsa svg .frm text { fill: #ced4da; }
}
/* slayt kipi (?yer=slayt): 16:9 slayttaki iframe'e sığan sıkı yerleşim */
.dsa-slayt body { overflow: hidden; }
.dsa-slayt .dsa { padding: 4px 6px 6px; max-width: none; }
.dsa-slayt .dsa-ust { margin-bottom: 2px; }
.dsa-slayt .dsa-baslik { visibility: hidden; }
.dsa-slayt .dsa-govde { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 8px; }
.dsa-slayt .dsa-govde.dsa-kodsuz { grid-template-columns: 1fr; }
.dsa-slayt .dsa-sahne svg { max-height: 350px; }
.dsa-slayt .dsa-pre { max-height: 370px; font-size: 11.5px; }
.dsa-slayt .dsa-cap { margin-top: 6px; min-height: 2.6em; padding: 6px 10px; font-size: .9rem; line-height: 1.4; }
.dsa-slayt .dsa-denetim { margin-top: 6px; gap: 4px; }
.dsa-slayt .dsa-d { height: 28px; min-width: 32px; font-size: 13px; }
.dsa-slayt .dsa-hiz { height: 28px; }
@media print { .dsa-denetim { display: none; } .dsa-pre { max-height: none; } }
/* v2: example bar (preset, difficulty, random) and own values */
.dsa-ornek, .dsa-kendi { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 0 0 8px; font-size: .85rem; }
.dsa-etk { color: var(--dsa-soluk); }
.dsa-sec { height: 30px; border-radius: 8px; border: 1px solid var(--dsa-cizgi); background: var(--dsa-yuzey); color: var(--dsa-yazi);
  max-width: 100%; }
.dsa-ornek .dsa-sec:first-of-type { flex: 1 1 220px; }
.dsa-zar { min-width: 34px; height: 30px; font-size: 16px; }
.dsa-girdi { flex: 1 1 260px; height: 30px; border-radius: 8px; border: 1px solid var(--dsa-cizgi); padding: 0 10px;
  background: var(--dsa-yuzey); color: var(--dsa-yazi); font: 13px 'Cascadia Mono', Consolas, monospace; }
.dsa-uygula { height: 30px; min-width: 64px; }
.dsa-hata { flex-basis: 100%; color: #e03131; font-size: .82rem; min-height: 1em; }
.dsa-kendi[hidden] { display: none; }
.dsa-slayt .dsa-ornek { margin-bottom: 4px; font-size: .78rem; }
.dsa-slayt .dsa-sec, .dsa-slayt .dsa-zar { height: 26px; }
.dsa-slayt .dsa-kendi, .dsa-slayt .dsa-ornek .dsa-etk { display: none; }
.dsa-statik .dsa-ornek, .dsa-statik .dsa-kendi { display: none; }
/* v2.1: input strip (every input value from the start; current = highlighted, done = faded, next = dashed),
   up-next line, speed − / + ; the controls sit ABOVE the scene so a long caption never pushes them away */
.dsa-serit { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin: 0 0 8px; font-size: .85rem; }
.dsa-serit[hidden] { display: none; }
.dsa-serit .dsa-etk { margin-right: 4px; }
.dsa-jeton { font: 13px/1.2 'Cascadia Mono', Consolas, monospace; padding: 3px 7px; border-radius: 6px; border: 1px solid var(--dsa-cizgi);
  background: var(--dsa-yuzey); color: var(--dsa-yazi); transition: background .3s, border-color .3s, opacity .3s; white-space: nowrap; }
.dsa-jeton.bitti { opacity: .4; }
.dsa-jeton.simdi { background: var(--dsa-vurgu); border-color: var(--dsa-vurgu-c); font-weight: 700; box-shadow: inset 0 0 0 1px var(--dsa-vurgu-c); }
.dsa-jeton.sonra { border-color: var(--dsa-ana); border-style: dashed; }
.dsa-denetim { margin: 0 0 8px; }
.dsa-sonraki { margin-top: 6px; color: var(--dsa-soluk); font-size: .88rem; line-height: 1.35; }
.dsa-sonraki-etk { font-weight: 700; color: var(--dsa-ana); }
.dsa-statik .dsa-serit, .dsa-statik .dsa-sonraki { display: none; }
@media print { .dsa-serit, .dsa-sonraki { display: none; } }
/* slide mode: fill the iframe; scene and code take the free height, caption scrolls inside its own box */
html.dsa-slayt, html.dsa-slayt body { height: 100%; }
.dsa-slayt .dsa { display: flex; flex-direction: column; height: 100vh; }
.dsa-slayt .dsa-ust, .dsa-slayt .dsa-ornek, .dsa-slayt .dsa-serit, .dsa-slayt .dsa-denetim { flex: 0 0 auto; }
.dsa-slayt .dsa-govde { flex: 1 1 auto; min-height: 0; }
.dsa-slayt .dsa-sahne { min-height: 0; height: 100%; }
.dsa-slayt .dsa-sahne svg { height: 100%; max-height: 100%; }
.dsa-slayt .dsa-kod { min-height: 0; height: 100%; }
.dsa-slayt .dsa-pre { max-height: none; }
.dsa-slayt .dsa-denetim { margin: 0 0 4px; }
.dsa-slayt .dsa-serit { flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden; margin-bottom: 4px; scrollbar-width: none; }
.dsa-slayt .dsa-serit::-webkit-scrollbar { display: none; }
.dsa-slayt .dsa-jeton { font-size: 11.5px; padding: 2px 5px; flex: 0 0 auto; }
.dsa-slayt .dsa-cap { flex: 0 0 auto; max-height: 4.4em; overflow-y: auto; }
.dsa-slayt .dsa-sonraki { flex: 0 0 auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: .8rem; margin-top: 3px; }
/* v2.2: program counter (▶ on the line being executed), branch notes (true/false, → call), skipped branch dimmed */
.dsa-sat.pc { background: var(--dsa-vurgu); border-left-color: var(--dsa-ana); box-shadow: inset 3px 0 0 var(--dsa-ana); font-weight: 600; }
.dsa-sat.pc .dsa-no::before { content: '\25B6'; color: var(--dsa-ana); font-size: .8em; margin-right: 2px; }
.dsa-sat.atla { opacity: .38; text-decoration: line-through; text-decoration-color: var(--dsa-soluk); }
.dsa-not { display: inline-block; margin-left: 10px; padding: 0 6px; border-radius: 4px; font-size: .85em; font-weight: 700;
  background: var(--dsa-ana); color: #fff; font-family: 'Segoe UI', Arial, sans-serif; }
.dsa-sat.atla .dsa-not { background: var(--dsa-soluk); }
/* v2.3: zoom / pan / full screen on the scene */
.dsa-sahne { position: relative; touch-action: pan-y; }
.dsa-sahne.dsa-zoomed { cursor: grab; touch-action: none; }
.dsa-sahne.dsa-drag { cursor: grabbing; }
.dsa-zoom { position: absolute; top: 6px; right: 6px; display: flex; gap: 3px; opacity: .55; transition: opacity .2s; z-index: 2; }
.dsa-sahne:hover .dsa-zoom, .dsa-zoom:focus-within { opacity: 1; }
.dsa-zb { width: 28px; height: 26px; border-radius: 6px; border: 1px solid var(--dsa-cizgi); background: var(--dsa-zemin);
  color: var(--dsa-yazi); cursor: pointer; font-size: 15px; line-height: 1; padding: 0; }
.dsa-zb:hover { border-color: var(--dsa-ana); color: var(--dsa-ana); }
.dsa:fullscreen { background: var(--dsa-zemin); max-width: none; height: 100vh; display: flex; flex-direction: column; overflow: auto; }
.dsa:fullscreen .dsa-govde { flex: 1 1 auto; min-height: 0; }
.dsa:fullscreen .dsa-sahne svg { max-height: none; height: 100%; }
.dsa:fullscreen .dsa-pre { max-height: none; }
@media print { .dsa-zoom { display: none; } }
.dsa-statik .dsa-zoom { display: none; }
</style>

<body>
<div data-dsanim="env-sanitize-startup"></div>
<script>/* dsanim v2 — scene model, SVG renderer and frame recorder.
 *
 * An animation is a function build(S, data) that adds elements to a Scene S, changes them and calls S.step(...)
 * after every visible change. The same code runs in the browser (player: frames are built from the dataset the
 * user picks, types or randomises) and in Node (export.js: GIF/PNG for slides and printed notes).
 *
 * Elements (all positions in scene units; the view box is cropped to the content automatically):
 *   box(id, {x, y, w, h, text, style, below, above, size, mono})      array cell, stack slot, generic rectangle
 *   node(id, {x, y, w, h, value, style, isNull, below})               linked-list node: [ value | • ]
 *   circle(id, {x, y, r, text, style, below})                          tree / graph vertex (x, y = centre)
 *   label(id, {x, y, text, style, size, anchor, bold, mono})           free text
 *   pointer(id, {target, text, side, style, dist})                     named pointer (top, head, front…) that follows its target
 *   arrow(id, {from, to, kind, style, text, bend, head})               kind 'next' (from a node's pointer cell) or 'center'
 *   region(id, {x, y, w, h, title, style})                             dashed background frame
 *   brace(id, {from, to, text, side, style, dist})                     curly brace over the elements from … to (their
 *                                                                      union), with a label: "already sorted", "< key"
 * Styles: normal, hl (highlight), new, del (removed), dim, active, empty.
 * Any text may be a plain string or {tr: '…', en: '…'}.
 *
 * CEN429 additions (backwards compatible — pure sugar over box/label/arrow, no new renderer kinds):
 *   memRow(prefix, bytes, {x, y, w, h, size, addrs})   a row of memory-byte cells (box.text = hex value,
 *     box.below = address in hex — box already supports `below`/`above`, reused as-is); bytes[i] =
 *     {value, style, addr, above, text} (all optional: value undefined → an empty/uninitialised cell).
 *     Returns the ids left to right (prefixN). Format helper: D.hex(n, digits) e.g. D.hex(0x41, 2) = '41'.
 *   lifelines(prefix, {x: [...], labels: [...], y0, y1})   N (2–3) vertical participant lines for a message
 *     sequence diagram (e.g. a TLS handshake): a name label above each line, the line itself a thin box.
 *   message(id, {x1, x2, y, text, style, head})   one labelled arrow between two lifeline x-positions at
 *     height y (message order = increasing y); built from two invisible 1×1 anchor boxes + a 'center' arrow.
 *
 * Following the instructor's static drawings: name every array row on its left (label "A ="), put index numbers
 * above the cells (box `above`), mark regions with braces, write the comparison on the right ("< 9"), and when the
 * path matters (binary search, partition…) keep earlier states visible as rows with S.snapshot().
 *   S.at(k)                          the input value with index k (in input.tokens / input.format order) is being
 *                                    processed from the next step on; the player highlights it in the input strip
 *   S.snapshot(prefix, ids, dx, dy, style)   copy elements (pointers/arrows/braces between them follow) to new ids
 *                                    prefix+id, shifted by (dx, dy) — a "trace row" that stays on screen
 */
(function (root) {
  'use strict';

  var COLORS = {
    normal: ['#ffffff', '#37474f', '#1f2933'],
    hl: ['#fff3bf', '#f08c00', '#1f2933'],
    new: ['#d3f9d8', '#2f9e44', '#1f2933'],
    del: ['#ffe3e3', '#e03131', '#1f2933'],
    dim: ['#f1f3f5', '#adb5bd', '#868e96'],
    active: ['#d0ebff', '#1971c2', '#1f2933'],
    empty: ['#f8f9fa', '#ced4da', '#adb5bd']
  };
  var ARROW = { normal: '#495057', hl: '#f08c00', new: '#2f9e44', del: '#e03131', dim: '#adb5bd', active: '#1971c2', empty: '#ced4da' };
  var FONT = "'Segoe UI', 'Helvetica Neue', Arial, sans-serif";
  var MONO = "Consolas, 'DejaVu Sans Mono', 'Cascadia Mono', monospace";
  var PW = 26; // width of the pointer cell of a list node

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function num(v) { return (Math.round(v * 10) / 10).toString(); }
  function txt(v, lang) {
    if (v === null || v === undefined) return '';
    if (typeof v !== 'object') return esc(v);
    if (lang) return esc(v[lang] !== undefined ? v[lang] : (v.en || ''));
    return '<tspan class="l-tr">' + esc(v.tr || '') + '</tspan><tspan class="l-en">' + esc(v.en || '') + '</tspan>';
  }
  function longest(v) {
    if (v && typeof v === 'object') return (v.tr || '').length > (v.en || '').length ? (v.tr || '') : (v.en || '');
    return String(v === undefined || v === null ? '' : v);
  }
  function copy(o) { return JSON.parse(JSON.stringify(o)); }

  // ------------------------------------------------------------------ scene
  function Scene() { this.el = {}; this.order = []; this.frames = []; this.cursor = undefined; }

  Scene.prototype._add = function (id, kind, p) {
    p = p || {};
    p.kind = kind;
    if (!p.style) p.style = kind === 'pointer' ? 'active' : (kind === 'region' ? 'dim' : 'normal');
    if (!(id in this.el)) this.order.push(id);
    this.el[id] = p;
    return id;
  };
  Scene.prototype.box = function (id, p) { p = p || {}; p.w = p.w || 58; p.h = p.h || 44; p.size = p.size || 18; if (p.mono === undefined) p.mono = true; return this._add(id, 'box', p); };
  Scene.prototype.node = function (id, p) { p = p || {}; p.w = p.w || 46; p.h = p.h || 40; return this._add(id, 'node', p); };
  Scene.prototype.circle = function (id, p) { p = p || {}; p.r = p.r || 22; return this._add(id, 'circle', p); };
  Scene.prototype.label = function (id, p) { p = p || {}; p.size = p.size || 15; p.anchor = p.anchor || 'middle'; return this._add(id, 'label', p); };
  Scene.prototype.pointer = function (id, p) { p = p || {}; p.side = p.side || 'top'; p.dist = p.dist === undefined ? 34 : p.dist; p.x = 0; p.y = 0; return this._add(id, 'pointer', p); };
  Scene.prototype.arrow = function (id, p) { p = p || {}; p.type = p.kind || 'next'; delete p.kind; p.bend = p.bend || 0; p.x = 0; p.y = 0; if (p.head === undefined) p.head = true; return this._add(id, 'arrow', p); };

<script>// CEN429 — Week 1 — Secure start-up: sanitising everything a program inherits
// Reference: docs/week-1/cen429-week-1.{tr,en}.md, section 11, "Guvenli baslatma: programin ilk satirlarinda
// yapilacaklar" (Cookbook recipes 1.1-1.9), and code/week-01/01-path-spoofing/report_secure.c. secure_startup()
// runs, in this order: sanitize_file_descriptors() (step 2), sanitize_environment() (step 1), umask(077)
// (step 3), disable_core_dump() (step 4), drop_privileges() (step 5). This animation takes a dangerous inherited
// state (an environment variable list plus leaked descriptors / umask / core dump / privilege) and walks the
// real pipeline, variable by variable, until only a small, known, safe state is left.
(function (D) {
  'use strict';
  var T = D.T;

  var REF_C = [
    'int main(int argc, char **argv)',
    '{',
    '    sanitize_file_descriptors();   /* step 2 */',
    '    sanitize_environment();        /* step 1 */',
    '    umask(077);                    /* step 3 */',
    '    disable_core_dump();           /* step 4 */',
    '    drop_privileges();             /* step 5 */',
    '',
    '    /* ... the program\'s actual work ... */',
    '    return 0;',
    '}',
    '',
    'void sanitize_environment(void)',
    '{',
    '    for (each inherited NAME=value) {',
    '        if (NAME is on the allow-list: TZ, LANG, HOME)',
    '            keep(NAME, value);      /* copied now, restored after clearenv() */',
    '        else',
    '            drop(NAME);             /* not on the allow-list, e.g. PATH, LD_PRELOAD */',
    '    }',
    '    clearenv();                     /* wipes ALL of it, kept or not */',
    '    setenv() each kept NAME=value;  /* then force PATH=/usr/bin:/bin, never inherited */',
    '}'
  ];
  var LINE = { fd: 3, env: 4, umask: 5, core: 6, priv: 7, envIf: 16, envKeep: 17, envDrop: 19, envClear: 21 };

  var SAFE_KEEP = ['TZ', 'LANG', 'HOME'];
  var KNOWN_DANGEROUS = ['PATH', 'LD_PRELOAD', 'LD_LIBRARY_PATH', 'IFS', 'BASH_ENV', 'ENV'];

  function ev(name, value) { return { name: name, value: value }; }
  function mk(envVars, fdExtra, stdoutClosed, umaskIn, coreDump, priv) {
    return { envVars: envVars, fdExtra: fdExtra, stdoutClosed: stdoutClosed, umaskIn: umaskIn, coreDump: coreDump, priv: priv };
  }

  var TYPICAL_ENV = [
    ev('PATH', '/tmp/evil:/usr/bin:/bin'), ev('LD_PRELOAD', '/tmp/keylogger.so'), ev('IFS', '$\'\\n\''),
    ev('HOME', '/home/alice'), ev('TZ', 'Europe/Istanbul'), ev('LANG', 'en_US.UTF-8'),
    ev('EDITOR', 'vim'), ev('SHELL', '/bin/bash'), ev('TERM', 'xterm-256color'), ev('PWD', '/home/alice/vault'),
    ev('USER', 'alice'), ev('BASH_ENV', '/tmp/payload.sh')
  ];
  var NORMAL = mk(TYPICAL_ENV, 2, true, '000', true, 'root');

  var SERVER_ENV = [
    ev('PATH', '.:/usr/bin'), ev('LD_LIBRARY_PATH', '/tmp/fake-libs'), ev('IFS', '\\t'), ev('ENV', '/tmp/rc'),
    ev('BASH_ENV', '/tmp/rc2'), ev('HOME', '/home/svc'), ev('TZ', 'UTC'), ev('LANG', 'C'),
    ev('LOGNAME', 'svc'), ev('MAIL', '/var/mail/svc'), ev('HISTFILE', '/home/svc/.bash_history'),
    ev('SSH_AUTH_SOCK', '/tmp/ssh.sock'), ev('DISPLAY', ':0'), ev('LD_PRELOAD', '/tmp/rootkit.so')
  ];
  var HARD = mk(SERVER_ENV, 3, true, '022', true, 'root');

  var EDGE_CLEAN_ENV = [];
  for (var i = 1; i <= 10; i++) EDGE_CLEAN_ENV.push(ev('CUSTOM_VAR_' + i, 'harmless-' + i));
  var EDGE_CLEAN = mk(EDGE_CLEAN_ENV, 0, false, '077', false, 'user');

  var EDGE_ALL_DANGEROUS_ENV = [];
  KNOWN_DANGEROUS.forEach(function (n, i) { EDGE_ALL_DANGEROUS_ENV.push(ev(n, 'danger-' + i)); });
  for (i = 0; i < 5; i++) EDGE_ALL_DANGEROUS_ENV.push(ev('PATH', '/tmp/evil' + i)); // repeated PATH entries, worst case
  var EDGE_ALL_DANGEROUS = mk(EDGE_ALL_DANGEROUS_ENV, 5, true, '000', true, 'root');

  /** Independent computation: a single filter() over the allowlist, no per-item loop matching build()'s. */
  function reference(data) {
    var survivors = ['PATH=/usr/bin:/bin'].concat(
      data.envVars.filter(function (v) { return SAFE_KEEP.indexOf(v.name) >= 0; })
                   .map(function (v) { return v.name + '=' + v.value; })
    );
    return {
      envSurvivors: survivors,
      fdLeaksClosed: data.fdExtra,
      stdoutFixed: data.stdoutClosed,
      umaskAfter: '077',
      coreDumpAfter: false,
      privilegeAfter: 'user'
    };
  }

  function build(S, data) {
    var n = data.envVars.length;
    var RX = 0, RY = 0, RW = 340, RH = 30, GAP = 4;
    S.label('title', { x: RX, y: RY - 18, text: T('devralınan ortam (' + n + ' değişken)', 'inherited environment (' + n + ' variables)'), anchor: 'start', size: 14, bold: true });
    for (var i = 0; i < n; i++) {
      var v = data.envVars[i];
      S.box('e' + i, { x: RX, y: RY + i * (RH + GAP), w: RW, h: RH, size: 12, mono: true, text: v.name + '=' + v.value, style: 'normal' });
    }
    var keptX = RX + RW + 60;
    S.label('keptTitle', { x: keptX, y: RY - 18, text: T('yeni, bilinen ortam', 'new, known environment'), anchor: 'start', size: 14, bold: true });
    S.box('safePath', { x: keptX, y: RY, w: 260, h: RH, size: 12, mono: true, text: 'PATH=/usr/bin:/bin', style: 'new' });
    var keptCount = 1;

    S.step(T('`sanitize_file_descriptors()` önce çalışır (adım 2): 0-2 garanti edilir, ' + data.fdExtra + ' sızmış tanıtıcı kapatılır.',
              '`sanitize_file_descriptors()` runs first (step 2): 0-2 are guaranteed, ' + data.fdExtra + ' leaked descriptor(s) are closed.'),
           { c: [LINE.fd] });

    for (i = 0; i < n; i++) {
      var vv = data.envVars[i];
      S.set('e' + i, { style: 'active' });
      S.at(i);
      var keep = SAFE_KEEP.indexOf(vv.name) >= 0;
      var dangerous = KNOWN_DANGEROUS.indexOf(vv.name) >= 0;
      if (keep) {
        S.set('e' + i, { style: 'new' });
        var ny = RY + keptCount * (RH + GAP);
        S.box('kept' + i, { x: keptX, y: ny, w: 260, h: RH, size: 12, mono: true, text: vv.name + '=' + vv.value, style: 'new' });
        keptCount++;
        var cap1 = i < 3
          ? T('`' + vv.name + '` beyaz listede — değeri önce KOPYALANIR, sonra yeni ortama geri konur.',
              '`' + vv.name + '` is on the allowlist — its value is COPIED first, then put back into the new environment.')
          : T('`' + vv.name + '` de beyaz listede — korunur.', '`' + vv.name + '` is on the allowlist too — kept.');
        S.step(cap1, { c: [
          { n: LINE.envIf, note: T(vv.name + ' beyaz listede mi (TZ, LANG, HOME)? evet', vv.name + ' on the allow-list (TZ, LANG, HOME)? yes') },
          LINE.envKeep,
          { n: LINE.envDrop, skip: true }
        ] });
      } else {
        S.set('e' + i, { style: 'del' });
        var why = dangerous
          ? T('`' + vv.name + '` bilinen tehlikeli bir değişken — beyaz listede DEĞİL, atılır.',
              '`' + vv.name + '` is a known-dangerous variable — NOT on the allowlist, dropped.')
          : T('`' + vv.name + '` beyaz listede değil — tehlikeli olmasa bile atılır (kara liste değil, beyaz liste).',
              '`' + vv.name + '` is not on the allowlist — dropped even though it isn\'t dangerous (an allowlist, not a blocklist).');
        var cap2 = i < 3 ? why : T('`' + vv.name + '` atılır (beyaz listede değil).', '`' + vv.name + '` dropped (not on the allowlist).');
        S.step(cap2, { c: [
          { n: LINE.envIf, note: T(vv.name + ' beyaz listede mi (TZ, LANG, HOME)? hayır', vv.name + ' on the allow-list (TZ, LANG, HOME)? no') },
          { n: LINE.envKeep, skip: true },
          LINE.envDrop
        ] });
      }
    }
    S.at(null);
    S.step(T('`clearenv()` bütün eski ortamı geçersiz kılar; yalnızca yukarıda kopyalanan ' + keptCount + ' değişken `setenv()` ile geri konur.',
              '`clearenv()` invalidates the whole old environment; only the ' + keptCount + ' variables copied above are put back with `setenv()`.'),
           { c: [LINE.envClear] });

    S.set('safePath', { style: 'hl' });
    S.box('umaskBox', { x: keptX, y: RY + (keptCount + 1) * (RH + GAP), w: 260, h: RH, size: 12, mono: true,
      text: T('umask: ' + data.umaskIn + ' -> 077', 'umask: ' + data.umaskIn + ' -> 077'), style: 'new' });
    S.step(T('`umask(077)` çalışır (adım 3): devralınan `' + data.umaskIn + '` yerine yeni dosyalar yalnız sahibine açık.',
              '`umask(077)` runs (step 3): instead of the inherited `' + data.umaskIn + '`, new files open only to the owner.'),
           { c: [LINE.umask] });

    S.box('coreBox', { x: keptX, y: RY + (keptCount + 2) * (RH + GAP), w: 260, h: RH, size: 12, mono: true,
      text: data.coreDump ? T('çökme dökümü: açık -> kapalı', 'core dump: enabled -> disabled') : T('çökme dökümü: zaten kapalı', 'core dump: already disabled'), style: 'new' });
    S.step(T('`disable_core_dump()` çalışır (adım 4): ' + (data.coreDump ? 'devralınan açık döküm kapatılır.' : 'döküm zaten kapalıydı, öylece kalır.'),
              '`disable_core_dump()` runs (step 4): ' + (data.coreDump ? 'the inherited enabled dump is turned off.' : 'the dump was already disabled, it stays off.')),
           { c: [LINE.core] });

    S.box('privBox', { x: keptX, y: RY + (keptCount + 3) * (RH + GAP), w: 260, h: RH, size: 12, mono: true,
      text: T('yetki: ' + data.priv + ' -> user', 'privilege: ' + data.priv + ' -> user'), style: 'new' });
    S.step(T('`drop_privileges()` çalışır (adım 5): ' + (data.priv === 'root' ? 'kök yetkisi kalıcı olarak bırakılır ve DOĞRULANIR.' : 'zaten normal kullanıcı, yine de doğrulanır.'),
              '`drop_privileges()` runs (step 5): ' + (data.priv === 'root' ? 'root privilege is permanently dropped and VERIFIED.' : 'already a normal user, still verified.')),
           { c: [LINE.priv] });

    S.result = reference(data);
    S.step(T('Sonuç: ' + n + ' devralınan değişkenden yalnız ' + (keptCount) + " tanesi hayatta kaldı (+ zorla ayarlanan PATH); tanıtıcılar, umask, döküm ve yetki hepsi bilinen güvenli değerlerde.",
              'Result: of ' + n + ' inherited variables only ' + (keptCount) + ' survive (+ the forced PATH); descriptors, umask, dump and privilege are all at known-safe values.'),
           {});
  }

  D.define({
    id: 'env-sanitize-startup',
    title: T('Güvenli başlatma: ortamı, tanıtıcıları, yetkiyi temizle', 'Secure start-up: sanitise the environment, descriptors, privilege'),
    code: { c: REF_C },
    presets: [
      { id: 'workstation', level: 'normal', name: T('Normal: masaüstü uygulaması (12 değişken)', 'Normal: a desktop app (12 variables)'), data: NORMAL },
      { id: 'server', level: 'hard', name: T('Zor: sunucu süreci, çok sayıda tehlikeli değişken (14)', 'Hard: a server process, many dangerous variables (14)'), data: HARD },
      { id: 'edge-clean', level: 'edge', name: T('Uç durum: hiçbiri tehlikeli değil, yine de hepsi atılır', 'Edge case: none are dangerous, yet all are dropped'), data: EDGE_CLEAN },
      { id: 'edge-all-dangerous', level: 'edge', name: T('Uç durum: hepsi bilinen tehlikeli değişken', 'Edge case: every variable is a known-dangerous one'), data: EDGE_ALL_DANGEROUS }
    ],
    levels: ['easy', 'normal', 'hard', 'extreme'],
    size: function (data) { return data.envVars.length; },
    random: function (level, r) {

      var n = counts[level] || 10;
      var pool = KNOWN_DANGEROUS.concat(SAFE_KEEP, ['EDITOR', 'SHELL', 'TERM', 'PWD', 'USER', 'LOGNAME', 'MAIL', 'DISPLAY']);
      var out = [];
      for (var i = 0; i < n; i++) out.push(ev(pool[D.randInt(r, 0, pool.length - 1)] + '_' + i, 'v' + i));
      var umasks = ['000', '002', '022', '077'];

    },
    input: {
      hint: T('AD=değer, AD=değer, …; fd=n; stdout=open|closed; umask=oktal; coredump=on|off; priv=root|user', 'NAME=value, NAME=value, …; fd=n; stdout=open|closed; umask=octal; coredump=on|off; priv=root|user'),
      format: function (data) {
        var envPart = data.envVars.map(function (v) { return v.name + '=' + v.value; }).join(', ');
        return envPart + '; fd=' + data.fdExtra + '; stdout=' + (data.stdoutClosed ? 'closed' : 'open') +
               '; umask=' + data.umaskIn + '; coredump=' + (data.coreDump ? 'on' : 'off') + '; priv=' + data.priv;
      },
      tokens: function (data) { return data.envVars.map(function (v) { return v.name + '=' + v.value; }); },
      parse: function (text) {
        var segs = String(text).split(';').map(function (s) { return s.trim(); }).filter(Boolean);
        if (segs.length !== 6) throw T('Biçim: "AD=değer, …; fd=n; stdout=…; umask=…; coredump=…; priv=…" olmalı.', 'Format must be "NAME=value, …; fd=n; stdout=…; umask=…; coredump=…; priv=…".');
        var envToks = segs[0].split(',').map(function (s) { return s.trim(); }).filter(Boolean);
        if (!envToks.length) throw T('En az bir değişken girin.', 'Enter at least one variable.');
        var envVars = envToks.map(function (t) {
          var eq = t.indexOf('=');
          if (eq <= 0) throw T('"' + t + '" biçimi "AD=değer" olmalı.', '"' + t + '" must be "NAME=value".');
          var name = t.slice(0, eq).trim(), value = t.slice(eq + 1).trim();
          if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(name)) throw T('"' + name + '" geçerli bir değişken adı değil.', '"' + name + '" is not a valid variable name.');
          return ev(name, value);
        });
        var fdM = segs[1].match(/^fd=(\d+)$/);
        if (!fdM) throw T('"' + segs[1] + '" biçimi "fd=n" olmalı.', '"' + segs[1] + '" must be "fd=n".');
        var stdoutM = segs[2].match(/^stdout=(open|closed)$/);
        if (!stdoutM) throw T('"' + segs[2] + '" "stdout=open" ya da "stdout=closed" olmalı.', '"' + segs[2] + '" must be "stdout=open" or "stdout=closed".');
        var umaskM = segs[3].match(/^umask=(\d{3})$/);
        if (!umaskM) throw T('"' + segs[3] + '" biçimi "umask=NNN" olmalı.', '"' + segs[3] + '" must be "umask=NNN".');
        var coreM = segs[4].match(/^coredump=(on|off)$/);
        if (!coreM) throw T('"' + segs[4] + '" "coredump=on" ya da "coredump=off" olmalı.', '"' + segs[4] + '" must be "coredump=on" or "coredump=off".');
        var privM = segs[5].match(/^priv=(root|user)$/);
        if (!privM) throw T('"' + segs[5] + '" "priv=root" ya da "priv=user" olmalı.', '"' + segs[5] + '" must be "priv=root" or "priv=user".');
        return mk(envVars, parseInt(fdM[1], 10), stdoutM[1] === 'closed', umaskM[1], coreM[1] === 'on', privM[1]);
      },
      bad: ['', 'PATH=x', 'PATH=x; fd=2', 'PATH=x; fd=2; stdout=maybe; umask=000; coredump=on; priv=root', '1BAD=x; fd=0; stdout=open; umask=000; coredump=off; priv=user']
    },
    reference: reference,
    build: build
  });
})(typeof DSAnim !== 'undefined' ? DSAnim : require('../../web/scene.js'));

<script>/* dsanim v2 player — builds the frames in the browser from the chosen example, random data or the user's own values,
 * then plays them: elements are matched by data-id, positions glide, colours fade, new elements appear, removed ones fade.
 * Controls: example picker (normal / hard / edge cases), difficulty + random, own values, first/prev/play/next/last,
 * speed, narration (browser speech synthesis), code language tabs.
 * Keyboard: space = play/pause, ← → = step, Home/End = first/last.
 * URL: lang=tr|en, example=<preset id>, level=easy|normal|hard|extreme, seed=<n>, step=<n>, auto=1, code=c|java|0,
 *      static=1 (print: last step, no controls), mode=slide (compact layout for a 16:9 slide).
 *      Old Turkish names still work: kare, oto, kod, statik, yer=slayt.
 */
(function () {
  'use strict';
  var NUMS = /-?\d*\.?\d+(?:e-?\d+)?/g;
  var TEXT = {
    tr: { play: 'Oynat', pause: 'Duraklat', next: 'Sonraki adım', prev: 'Önceki adım', first: 'Başa dön', last: 'Sona git',
          speed: 'Hız', voice: 'Sesli anlatım', step: 'Adım', example: 'Örnek', level: 'Zorluk', random: 'Rastgele',
          own: 'Kendi değerlerin', apply: 'Uygula', custom: 'Kendi değerleri', randomName: 'Rastgele',
          zoomIn: 'Yakınlaştır (Ctrl+tekerlek)', zoomOut: 'Uzaklaştır', zoomFit: 'Sığdır (0)', full: 'Tam ekran (f)', input: 'Girdi', upNext: 'Sıradaki →', lastStep: 'Son adım.', faster: 'Hızlandır (+)', slower: 'Yavaşlat (−)',
          levels: { easy: 'kolay', normal: 'normal', hard: 'zor', extreme: 'uç' },
          groups: { normal: 'Normal', hard: 'Zor', edge: 'Uç ve anormal durumlar' } },
    en: { play: 'Play', pause: 'Pause', next: 'Next step', prev: 'Previous step', first: 'First step', last: 'Last step',
          speed: 'Speed', voice: 'Narration', step: 'Step', example: 'Example', level: 'Difficulty', random: 'Random',
          own: 'Your values', apply: 'Apply', custom: 'Your values', randomName: 'Random',
          zoomIn: 'Zoom in (Ctrl+wheel)', zoomOut: 'Zoom out', zoomFit: 'Fit (0)', full: 'Full screen (f)', input: 'Input', upNext: 'Next →', lastStep: 'Last step.', faster: 'Faster (+)', slower: 'Slower (−)',
          levels: { easy: 'easy', normal: 'normal', hard: 'hard', extreme: 'extreme' },
          groups: { normal: 'Normal', hard: 'Hard', edge: 'Edge and abnormal cases' } }
  };
  var CODE_NAME = { c: 'C', java: 'Java', cpp: 'C++', py: 'Python', sh: 'Shell', ps1: 'PowerShell', pseudo: 'Pseudocode' };
  var SPEEDS = [0.5, 0.75, 1, 1.5, 2, 3, 4];
  function savedSpeed() { try { var v = +window.localStorage.getItem('dsanim-speed'); return SPEEDS.indexOf(v) >= 0 ? v : 1; } catch (e) { return 1; } }
  function saveSpeed(v) { try { window.localStorage.setItem('dsanim-speed', String(v)); } catch (e) { /* private mode */ } }
  function plain(s) { return String(s || '').replace(/\*\*/g, '').replace(/`/g, ''); }   // drop bold markers and backticks, keep a lone * (it is an operator)

  function ease(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

  Player.prototype.morph = function (html, animate) {
    var self = this, tmp = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    tmp.innerHTML = html;
    if (this.anim) { cancelAnimationFrame(this.anim); this.anim = null; if (this.finish) this.finish(); }
    var jobs = [];
    ['arka', 'ok', 'sekil', 'etiket'].forEach(function (layer) {
      var live = self.svg.querySelector('.kat-' + layer), next = tmp.querySelector('.kat-' + layer);
      if (!live || !next) return;
      var old = {};
      Array.prototype.forEach.call(live.children, function (c) { if (!c.classList.contains('dsa-cikis')) old[c.getAttribute('data-id')] = c; });
      var order = [];
      Array.prototype.slice.call(next.children).forEach(function (y) {
        var id = y.getAttribute('data-id'), o = old[id];
        if (o && o.tagName === y.tagName) {
          delete old[id];
          var attr = y.tagName === 'path' ? 'd' : 'transform', from = o.getAttribute(attr), to = y.getAttribute(attr);
          var a = nums(from), b = nums(to);
          if (y.tagName === 'g') self.updateInner(o, y);
          o.setAttribute('class', y.getAttribute('class'));
          ['stroke', 'marker-end', 'opacity'].forEach(function (k) { if (y.hasAttribute(k)) o.setAttribute(k, y.getAttribute(k)); else if (k !== 'stroke') o.removeAttribute(k); });
          if (animate && a.length && a.length === b.length && from !== to) jobs.push({ e: o, n: attr, a: a, b: b, s: to });
          else o.setAttribute(attr, to);
          order.push(o);
        } else {
          var ne = y.cloneNode(true);
          if (animate) ne.classList.add('dsa-giris');
          order.push(ne);
        }
      });
      Object.keys(old).forEach(function (id) {
        var c = old[id];
        if (animate) { c.classList.add('dsa-cikis'); setTimeout(function () { if (c.parentNode) c.parentNode.removeChild(c); }, 450); }
        else live.removeChild(c);
      });
      order.forEach(function (e) { live.appendChild(e); });
      if (animate) requestAnimationFrame(function () { requestAnimationFrame(function () {
        Array.prototype.forEach.call(live.querySelectorAll('.dsa-giris'), function (e) { e.classList.remove('dsa-giris'); });
      }); });
    });
    if (!jobs.length) return;
    var dur = 480 / this.speed, t0 = null;
    this.finish = function () { jobs.forEach(function (j) { j.e.setAttribute(j.n, j.s); }); self.finish = null; };
    function tick(t) {
      if (t0 === null) t0 = t;
      var p = Math.min(1, (t - t0) / dur), e = ease(p);
      jobs.forEach(function (j) { j.e.setAttribute(j.n, fill(j.s, j.a.map(function (x, k) { return +x + (+j.b[k] - +x) * e; }))); });
      if (p < 1) self.anim = requestAnimationFrame(tick); else { self.anim = null; if (self.finish) self.finish(); }
    }
    this.anim = requestAnimationFrame(tick);
  };

  Player.prototype.updateInner = function (o, y) {
    var a = o.children, b = y.children, same = a.length === b.length;
    for (var k = 0; same && k < a.length; k++) if (a[k].tagName !== b[k].tagName) same = false;
    if (!same) { o.innerHTML = y.innerHTML; return; }
    for (var j = 0; j < a.length; j++) {
      var ea = a[j], eb = b[j];
      Array.prototype.forEach.call(eb.attributes, function (at) { if (ea.getAttribute(at.name) !== at.value) ea.setAttribute(at.name, at.value); });
      Array.prototype.slice.call(ea.attributes).forEach(function (at) { if (!eb.hasAttribute(at.name)) ea.removeAttribute(at.name); });
      if (ea.innerHTML !== eb.innerHTML) ea.innerHTML = eb.innerHTML;
    }
  };

  Player.prototype.wait = function () { var c = pick(this.frames[this.i].cap, this.lang) || ''; return (700 + c.length * 20) / this.speed; };
  Player.prototype.play = function () {
    var self = this;
    if (this.i >= this.frames.length - 1) this.go(0, false);
    this.playing = true; this.playBtn.innerHTML = '&#x23F8;'; this.playBtn.title = TEXT[this.lang].pause;
    function next() {
      if (!self.playing) return;
      if (self.i >= self.frames.length - 1) { self.stop(); return; }
      self.go(self.i + 1, true);
      self.schedule(next);
    }
    this.schedule(next);
  };
  Player.prototype.schedule = function (fn) {
    var self = this;
    clearTimeout(this.timer);
    if (this.voice && this.utter) {
      var done = false, backup = setTimeout(function () { if (!done) { done = true; fn(); } }, 20000);
      this.utter.onend = function () { if (!done) { done = true; clearTimeout(backup); self.timer = setTimeout(fn, 500 / self.speed); } };
    } else this.timer = setTimeout(fn, this.wait());
  };
  Player.prototype.stop = function () {
    this.playing = false; clearTimeout(this.timer);
    if (this.playBtn) { this.playBtn.innerHTML = '&#x25B6;'; this.playBtn.title = TEXT[this.lang].play; }
  };
  Player.prototype.say = function () {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance((pick(this.frames[this.i].cap, this.lang) || '').replace(/[`*]/g, ''));
    u.lang = this.lang === 'tr' ? 'tr-TR' : 'en-US';
    u.rate = Math.min(1.6, 0.95 * this.speed);
    var v = window.speechSynthesis.getVoices().filter(function (s) { return s.lang && s.lang.toLowerCase().indexOf(u.lang.slice(0, 2).toLowerCase()) === 0; });
    if (v.length) u.voice = v[0];
    this.utter = u;
    window.speechSynthesis.speak(u);
  };

  function theme() {
    try {
      var p = window.parent && window.parent !== window ? window.parent.document.body : null, s = p && p.getAttribute('data-md-color-scheme');
      if (s === 'slate') document.documentElement.classList.add('dsa-koyu');
      else if (s === 'default') document.documentElement.classList.add('dsa-acik');
    } catch (e) { /* other origin: follow the OS theme */ }
  }
  function reportHeight(id) {
    if (window.parent === window) return;
    var last = 0;
    function send() {
      var h = Math.ceil(document.documentElement.getBoundingClientRect().height);
      if (Math.abs(h - last) > 2) { last = h; window.parent.postMessage({ dsanim: true, ad: id, yukseklik: h }, '*'); }
    }
    if ('ResizeObserver' in window) new ResizeObserver(send).observe(document.documentElement);
    window.addEventListener('load', send);
    setTimeout(send, 300);
  }

  function start() {
    var q = new URLSearchParams(location.search);
    function p(a, b) { return q.get(a) !== null ? q.get(a) : q.get(b); }
    var ids = Object.keys(window.DSAnim.registry);
    Array.prototype.forEach.call(document.querySelectorAll('[data-dsanim]'), function (root, k) {
      var spec = window.DSAnim.registry[root.getAttribute('data-dsanim')] || window.DSAnim.registry[ids[k]];
      if (!spec) return;
      theme();
      var codeArg = p('code', 'kod'), mode = p('mode', 'yer');
      var player = new Player(root, spec, {
        lang: q.get('lang') || (document.documentElement.lang || 'tr').slice(0, 2),
        example: q.get('example'), level: q.get('level'), seed: q.get('seed'),
        step: +(p('step', 'kare') || 1), auto: p('auto', 'oto') === '1', static: p('static', 'statik') === '1',
        code: codeArg, noCode: codeArg === '0', slide: mode === 'slide' || mode === 'slayt'
      });
      if (window.parent === window || q.get('focus') === '1') root.focus({ preventScroll: true });
      reportHeight(spec.id);
      if (q.get('selftest') === '1') selftest(player, spec);
    });
  }
  /** ?selftest=1 — drive the real UI: every example, random data at every level, own values (good and bad). */
  function selftest(player, spec) {
    var errors = [], runs = 0;
    window.addEventListener('error', function (e) { errors.push('window error: ' + e.message); });
    function walk(label) {
      if (!player.frames.length) errors.push(label + ': no frames');
      for (var i = 0; i < player.frames.length; i++) player.go(i, false);
      if (!player.svg.querySelectorAll('[data-id]').length) errors.push(label + ': nothing drawn');
      if (!player.cap.textContent.trim()) errors.push(label + ': empty caption');
      runs++;
    }
    try {
      spec.presets.forEach(function (p) {
        player.sel.value = p.id; player.sel.dispatchEvent(new Event('change')); walk('example ' + p.id);
      });
      (spec.levels || ['easy', 'normal', 'hard', 'extreme']).forEach(function (l) {
        for (var s = 1; s <= 5; s++) { player.useRandom(l, s, true); walk('random ' + l + '/' + s); }
      });
      if (spec.input) {
        player.ownInput.value = spec.input.format(spec.presets[spec.presets.length - 1].data);
        player.applyBtn.click();
        if (player.err.textContent) errors.push('own values rejected: ' + player.err.textContent);
        walk('own values');
        player.ownInput.value = (spec.input.bad && spec.input.bad[1]) || '@@@';
        player.applyBtn.click();
        if (!player.err.textContent) errors.push('bad own values were accepted');
      }
      player.go(0, false); player.go(1, true); player.go(2, true);   // animated transitions must not throw
      var vbw = function () { return +player.svg.getAttribute('viewBox').split(' ')[2]; }, w0 = vbw();
      player.zoomBy(2);
      if (Math.abs(vbw() * 2 - w0) > 1) errors.push('zoom in did not halve the view width');
      player.resetView();
      if (Math.abs(vbw() - w0) > 1) errors.push('fit did not restore the view');
    } catch (e) { errors.push(String(e && e.stack || e)); }
    var out = document.createElement('pre');
    out.id = 'dsa-selftest';
    out.textContent = JSON.stringify({ id: spec.id, ok: !errors.length, runs: runs, errors: errors });
    document.body.appendChild(out);
  }

  window.DSAnimPlayer = Player;
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>
