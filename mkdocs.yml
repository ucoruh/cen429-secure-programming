# Project information 
site_name: "RTEU CEN429 Secure Programming Course"
docs_dir: docs  # Where to find the markdown files
site_dir: site  # Where to output the HTML files
# Google Drive her klasöre desktop.ini koyar; siteye girmesin
exclude_docs: |
  desktop.ini
  **/desktop.ini
  parcalar/
site_author: 'Asst. Prof. Dr. Uğur CORUH'
site_url: 'https://ucoruh.github.io/cen429-secure-programming/'
site_description: 'CEN429 Secure Programming course notes, slides and hands-on labs'

# Repository
repo_name: 'GitHub'
repo_url: 'https://github.com/ucoruh/cen429-secure-programming'
edit_uri: 'https://github.com/ucoruh/cen429-secure-programming/edit/main/docs/'

# Copyright
copyright: Copyright &copy; 2006 - 2026 Recep Tayyip Erdoğan University

# Configuration
theme:
  name: material
  custom_dir: docs/overrides

  favicon: images/favicon.png

  icon:
    previous: fontawesome/solid/angle-left
    next: fontawesome/solid/angle-right
    logo: logo  # Adjust the file name if necessary
  
  # Don't include MkDocs' JavaScript
  include_search_page: false
  search_index_only: true
  
  # Static files  
  static_templates:
   - 404.html
    
  # Default values, taken from mkdocs_theme.yml
  language: en
  features:
    - content.code.annotate
    - content.tabs.link
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest

  palette:
    - scheme: default
      primary: cyan
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: orange
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  font:
    text: Roboto
    code: Roboto Mono

# Customization
extra:
  annotate:
    json: [.s2]
  analytics:
    provider: google
    property: !ENV GOOGLE_ANALYTICS_RTEU_CE407
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: >-
            Thanks for your feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: >- 
            Thanks for your feedback! Help us improve this page by
            using our <a href="..." target=_blank>feedback form</a>.
  consent:
    title: Cookie consent
    description: >-
      We use cookies to recognize your repeated visits and preferences, as well
      as to measure the effectiveness of our documentation and whether users
      find what they're searching for. With your consent, you're helping us to
      make our documentation better.
    cookies:
      analytics: Google Analytics
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ucoruh
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/ugurcoruh/
    - icon: fontawesome/brands/docker
      link: https://hub.docker.com/u/ucoruh/
    - icon: fontawesome/regular/id-card
      link: https://dblp.org/pid/230/0394.html
    - icon: fontawesome/brands/orcid
      link: https://orcid.org/my-orcid?orcid=0000-0003-4193-8401
    - icon: fontawesome/brands/google
      link: https://scholar.google.com/citations?user=KIU4ltMAAAAJ&hl=tr

# Extensions
markdown_extensions:
  - admonition
  - abbr
  - attr_list
  - def_list
  - footnotes
  - meta
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: ucoruh
      repo: cen429-secure-programming
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - codehilite:
      guess_lang: true

# Plugins
plugins:
  - mkdocs-simple-hooks:
      hooks:
        on_config: "hooks:on_config"
        on_env: "hooks:on_env"
        on_post_build: "hooks:on_post_build"
  - external-markdown
  - mkdocs-video
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - i18n:
      docs_structure: suffix
      reconfigure_material: true
      reconfigure_search: true
      fallback_to_default: true
      languages:
        - locale: en
          name: "English"
          build: true
          site_name: "RTEU CEN429 Secure Programming Course"
          site_description: "CEN429 Secure Programming course notes, slides and hands-on labs"
        - locale: tr
          name: "Türkçe"
          build: true
          default: true
          site_name: "RTEU CEN429 Güvenli Programlama Kursu"
          site_description: "CEN429 Güvenli Programlama ders notları, sunumları ve uygulamalı laboratuvarları"
          nav_translations:
            Home: "Anasayfa"
            Syllabus: "Ders Programı"
            Course Modules: "Ders Modülleri"
            License: "Lisans"
            Resume: "Özgeçmiş"
            Changelog: "Revizyonlar"
            "Project Guide": "Proje Rehberi"
            "Week-1 (Introduction and Application Protection Plan)": "Hafta-1 (Giriş ve Uygulama Koruma Planı)"
            "Week-2 (Computer Viruses and Security Models)": "Hafta-2 (Bilgisayar Virüsleri ve Güvenlik Modelleri)"
            "Week-3 (Data Security: In Transit, At Rest, In Use)": "Hafta-3 (Veri Güvenliği: Aktarımda, Beklemede, Kullanımda)"
            "Week-4 (Code Hardening: C/C++)": "Hafta-4 (Kod Sağlamlaştırma: C/C++)"
            "Week-5 (Code Hardening: Java and Interpreted Languages)": "Hafta-5 (Kod Sağlamlaştırma: Java ve Yorumlanan Diller)"
            "Week-6 (Runtime Application Self-Protection)": "Hafta-6 (Çalışma Zamanı Uygulama Öz Koruması)"
            "Week-7 (Midterm Project Demonstrations)": "Hafta-7 (Ara Proje Gösterimleri)"
            "Week-8 (Midterm Exam Week: Quiz-1)": "Hafta-8 (Ara Sınav Haftası: Quiz-1)"
            "Week-9 (Advanced Obfuscation and Diversification)": "Hafta-9 (Gelişmiş Kod Gizleme ve Çeşitlendirme)"
            "Week-10 (Certificates and Cryptographic Methods)": "Hafta-10 (Sertifikalar ve Kriptografik Yöntemler)"
            "Week-11 (Whitebox Cryptography)": "Hafta-11 (Whitebox Kriptografi)"
            "Week-12 (Security Certifications and Penetration Test Planning)": "Hafta-12 (Güvenlik Sertifikasyonları ve Sızma Testi Planlaması)"
            "Week-13 (Security Requirements)": "Hafta-13 (Güvenlik Gereksinimleri)"
            "Week-14 (Tigress and Diversification)": "Hafta-14 (Tigress ve Çeşitlendirme)"
            "Week-15 (Final Project Demonstrations)": "Hafta-15 (Final Proje Gösterimleri)"
            "Week-16 (Final Exam Period: Quiz-2)": "Hafta-16 (Final Dönemi: Quiz-2)"
  - tags:
      tags_file: tags.md
  - minify:
      minify_html: true
      htmlmin_opts:
        remove_comments: true
  - git-revision-date-localized:
      fallback_to_build_date: true
      type: timeago
  - git-authors:
      sort_authors_by: contribution
  - macros

extra_css:
  - stylesheets/cen429.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

